# ⚠️  INTENTIONALLY BROKEN AT RUNTIME — for the evaluator quickstart
# Symptom: container is OOMKilled (exit code 137) and restarts, then CrashLoopBackOff.
# Root cause: the process allocates ~256 MiB but the memory limit is 64 MiB.
# Expected diagnosis: get_pod shows lastState.terminated.reason=OOMKilled;
# a fix proposal raises resources.limits.memory (or reduces the workload's usage).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: demo
  labels:
    app: memory-hog
    app.kubernetes.io/part-of: shrikeops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: python:3.12-alpine
          command: ["python", "-c", "import time; b = b'x' * (256 * 1024 * 1024); time.sleep(3600)"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
