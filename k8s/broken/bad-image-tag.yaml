# ⚠️  INTENTIONALLY BROKEN AT RUNTIME — for the evaluator quickstart
# Symptom: pod stays Pending with ErrImagePull / ImagePullBackOff.
# Root cause: the image tag does not exist in the registry.
# Expected diagnosis: list_events shows "manifest unknown" / "not found" for busybox:1.36-does-not-exist;
# a fix proposal points the image at an existing tag (e.g. busybox:1.36).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: demo
  labels:
    app: bad-image
    app.kubernetes.io/part-of: shrikeops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image
  template:
    metadata:
      labels:
        app: bad-image
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36-does-not-exist
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
