# ⚠️  INTENTIONALLY BROKEN. Apply only to a disposable cluster (kind/minikube).
# Sample: unschedulable. See README.md in this folder.
# Symptom: both pods stay Pending; the scheduler cannot place them.
#   too-big   -> requests 64 CPUs, more than any laptop/kind node has ("Insufficient cpu")
#   wrong-node -> nodeSelector matches no node ("didn't match Pod's node affinity/selector")
# Fix: fixed.yaml requests 10m CPU and drops the nodeSelector.
apiVersion: v1
kind: Namespace
metadata:
  name: broken-scheduling
  labels:
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "unschedulable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: too-big
  namespace: broken-scheduling
  labels:
    app: too-big
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "unschedulable"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: too-big
  template:
    metadata:
      labels:
        app: too-big
        app.kubernetes.io/part-of: shrikeops-demo
        shrikeops-demo/broken-sample: "unschedulable"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: "64"
              memory: 16Mi
            limits:
              cpu: "64"
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wrong-node
  namespace: broken-scheduling
  labels:
    app: wrong-node
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "unschedulable"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wrong-node
  template:
    metadata:
      labels:
        app: wrong-node
        app.kubernetes.io/part-of: shrikeops-demo
        shrikeops-demo/broken-sample: "unschedulable"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        shrikeops-demo/disk: nvme
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
