# Fixed version of the hpa-no-requests sample: the container has a CPU request, so the HPA can compute utilisation.
apiVersion: v1
kind: Namespace
metadata:
  name: broken-hpa
  labels:
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: broken-hpa
  labels:
    app: api
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: shrikeops-demo
        shrikeops-demo/broken-sample: "hpa-no-requests"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: broken-hpa
  labels:
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
