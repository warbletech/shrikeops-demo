# ⚠️  INTENTIONALLY BROKEN. Apply only to a disposable cluster (kind/minikube) WITH metrics-server.
# Sample: hpa-no-requests. See README.md in this folder.
# Symptom: the HPA cannot compute CPU utilisation and never scales.
# Root cause: utilisation is a percentage of the CPU *request*, and the container has none.
# Fix: fixed.yaml adds a CPU request (and limit).
apiVersion: v1
kind: Namespace
metadata:
  name: broken-hpa
  labels:
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: broken-hpa
  labels:
    app: api
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: shrikeops-demo
        shrikeops-demo/broken-sample: "hpa-no-requests"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: broken-hpa
  labels:
    app.kubernetes.io/part-of: shrikeops-demo
    shrikeops-demo/broken-sample: "hpa-no-requests"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
